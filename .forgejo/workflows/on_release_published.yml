name: '[Workflow] On Release Published'

# Forgejo mirror of .github/workflows/on_release_published.yml. Adaptations:
#   - publishes to the in-cluster Harbor (harbor.webgrip.dev, LAN-only) instead of
#     GHCR, via the Forgejo-only reusable workflow docker-build-and-push-harbor.yml
#     which pins runs-on: docker (the in-cluster runner is the only one that reaches Harbor).
#   - supply chain: cosign signs + attests via OpenBao Transit (the key never leaves
#     OpenBao; the runner authenticates with its k8s ServiceAccount — no GitHub OIDC/Fulcio)
#     and uploads the SBOM to Dependency-Track — see the local
#     .forgejo/actions/cosign-sign-attest. GitHub-only bits (SLSA build provenance,
#     Trivy SARIF -> GitHub Security tab) have no Forgejo analog and are omitted.
# GHCR: the .forgejo mirror-to-GHCR + GHCR signing jobs were removed (Harbor is the source of
# truth). The .github/ pipeline still publishes to GHCR, untouched.

concurrency:
  group: release-${{ github.ref }}-${{ github.event.release.id || inputs.tag }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  # CI-cut releases fire the `release` trigger natively: they are created with the
  # webgrip-ci bot PAT, and only same-token actions are loop-suppressed. (Same event path
  # as the .github App-token side.) workflow_dispatch remains for manual re-publish or
  # backfill of an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. techdocs-builder-v1.2.3'
        required: true
        type: string
      is_prerelease:
        description: 'Whether this is a prerelease'
        required: false
        default: 'false'
        type: string

jobs:
  parse-release-tag:
    name: 'Parse tag'
    # In-cluster Forgejo has a single ephemeral runner pool advertising `docker`.
    runs-on: docker
    outputs:
      image: ${{ steps.parse.outputs.image }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      created: ${{ steps.parse.outputs.created }}
    steps:
      - id: parse
        name: Extract image + version
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch (Forgejo CI path) passes the tag as an input; the release event
          # supplies it via github.event.release.tag_name.
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}'

          if [[ "$tag" =~ ^(.+)-v(.+)$ ]]; then
            image="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "Unsupported tag format: $tag" >&2
            echo "Expected: <image>-v<version> (e.g. helm-deploy-v1.2.3)" >&2
            exit 1
          fi

          # Release event carries a publish timestamp; a dispatch does not, so stamp now.
          created='${{ github.event.release.published_at || github.event.release.created_at }}'
          if [[ -z "$created" ]]; then created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  # ONE distribute job for BOTH prereleases and final releases, and — since ADR-0009 — a job that
  # PROMOTES rather than builds whenever the verify build already pushed the artifact.
  #
  # The verify build on main (dockerVerifyGate, config >= 1.2) builds with the release flags and
  # pushes :cand-<sha>. Rebuilding that here would only prove the same SOURCE builds twice;
  # promoting the manifest by digest makes the verified bytes and the released bytes the SAME
  # bytes, and turns the dominant cost of a release (a second full build) into one registry PUT.
  # BuildKit's provenance + SBOM attestations live inside the pushed index, so they travel with
  # the digest. No candidate (config lag, manual dispatch of an old tag, cand tag GC'd) -> the
  # fallback step runs the exact composite the old reusable wrapped.
  #
  # This is deliberately NOT a `uses:` of the harbor-fast reusable with an `if:` around it:
  # Forgejo flattens a reusable's inner jobs into this graph and does NOT apply the caller job's
  # `if:` to them — a "skipped" reusable still ran its flattened build (the bug that raced two
  # builds on one Harbor tag). Conditionals here must be STEP-level, which is what forced the
  # reusable's guts inline. Side effect: two nested wrapper jobs disappear from every release.
  release-distribute-harbor:
    name: 'Distribute'
    needs: [parse-release-tag]
    runs-on: docker
    permissions:
      contents: read
    steps:
      - name: Promote the verified candidate by digest
        id: promote
        shell: bash
        env:
          REGISTRY: harbor.webgrip.dev
          IMAGE: ${{ needs.parse-release-tag.outputs.image }}
          VERSION: ${{ needs.parse-release-tag.outputs.version }}
          IS_PRERELEASE: ${{ needs.parse-release-tag.outputs.is_prerelease }}
          HARBOR_USER: ${{ secrets.HARBOR_ROBOT_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        run: |
          set -euo pipefail
          repo="webgrip/${IMAGE}"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'

          # Candidates are keyed by VERSION, not commit: @semantic-release/git creates the
          # version-bump commit after the verify build, and the release tag points at that bump
          # commit — so a sha-keyed candidate can never be found from the tag (measured on
          # node-ci-runner-v1.0.2: tag targets the [skip ci] commit, parent of the push that
          # built the candidate). The version is the one name the gate and this job derive
          # independently, with no git archaeology in between.
          cand="cand-${VERSION}"
          digest="$(curl -fsSI -u "${HARBOR_USER}:${HARBOR_TOKEN}" -H "Accept: ${accept}" \
            "https://${REGISTRY}/v2/${repo}/manifests/${cand}" 2>/dev/null \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')" || true
          if [ -z "${digest:-}" ]; then
            echo "no candidate ${cand} in Harbor — building from source (pre-ADR-0009 path)"
            echo "promoted=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Byte-exact retag: GET the manifest by digest, PUT the SAME bytes under the release
          # tag with the SAME content type. The registry dedups everything; this moves no data.
          # The digest the PUT returns MUST equal the candidate digest — anything else means the
          # bytes changed in flight, and a changed artifact must not be tagged as the release.
          curl -fsS -u "${HARBOR_USER}:${HARBOR_TOKEN}" -H "Accept: ${accept}" -D /tmp/mh.txt \
            -o /tmp/manifest.json "https://${REGISTRY}/v2/${repo}/manifests/${digest}"
          ctype="$(tr -d '\r' < /tmp/mh.txt | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1)"

          retag() {
            local tag="$1"
            local got
            got="$(curl -fsS -u "${HARBOR_USER}:${HARBOR_TOKEN}" -X PUT \
              -H "Content-Type: ${ctype}" --data-binary @/tmp/manifest.json -D - -o /dev/null \
              "https://${REGISTRY}/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')"
            [ "$got" = "$digest" ] || { echo "::error::retag ${tag}: digest changed in flight (${got} != ${digest})"; exit 1; }
            echo "promoted ${repo}@${digest} to :${tag} (byte-exact)"
          }
          retag "${VERSION}"
          if [ "${IS_PRERELEASE}" != "true" ]; then retag latest; fi

          # Hygiene, fail-soft: the candidate served its purpose. A robot without delete rights
          # just leaves it for the (recommended) Harbor retention rule on cand-*.
          curl -fsS -u "${HARBOR_USER}:${HARBOR_TOKEN}" -X DELETE \
            "https://${REGISTRY}/api/v2.0/projects/webgrip/repositories/${IMAGE}/artifacts/${digest}/tags/${cand}" \
            >/dev/null 2>&1 && echo "deleted ${cand}" || echo "left ${cand} behind (no delete rights or API refusal — harmless)"

          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # Fallback: exactly what the harbor-fast reusable wrapped, inline. Same composite, same
      # inputs, same registry cache refs — a release with no candidate behaves as every release
      # did before ADR-0009.
      - name: Build and push (no candidate)
        if: ${{ steps.promote.outputs.promoted != 'true' }}
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/docker-build-push-registry-fast@main
        env:
          REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
        with:
          registry: harbor.webgrip.dev
          docker-context: "ops/docker/${{ needs.parse-release-tag.outputs.image }}"
          docker-file: "Dockerfile"
          # amd64-only: the homelab (and these runner images' only consumer) is amd64 Talos, so we
          # drop the emulated arm64 build — the dominant build-time cost. See webgrip/homelab-cluster
          # ADR-0036. To restore arm64, set platforms to "linux/amd64,linux/arm64".
          platforms: "linux/amd64"
          docker-build-args: |
            IMAGE_CREATED=${{ needs.parse-release-tag.outputs.created }}
            IMAGE_VERSION=${{ needs.parse-release-tag.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            # Route base images through Harbor: the Dockerfiles default these to docker.io/ghcr.io
            # (so .github/GHCR builds work unchanged); the in-cluster build overrides them to the
            # Harbor pull-through proxy projects. Each image only consumes the prefixes it
            # declares; the rest are harmlessly unused. REGISTRY_DHI is symmetry/self-documentation
            # only — cve-gate's Dockerfile already defaults it to the proxy (dhi.io refuses
            # anonymous pulls).
            REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub
            REGISTRY_GHCR=harbor.webgrip.dev/ghcr
            REGISTRY_MCR=harbor.webgrip.dev/mcr
            REGISTRY_DHI=harbor.webgrip.dev/dhi
          # Owner hardcoded `webgrip` (the Harbor project): github.repository_owner is EMPTY on
          # Forgejo dispatch runs (double-slash refs otherwise). :latest only on a FINAL release;
          # on a prerelease the second line resolves to '' and blank tags are skipped.
          docker-tags: |
            webgrip/${{ needs.parse-release-tag.outputs.image }}:${{ needs.parse-release-tag.outputs.version }}
            ${{ needs.parse-release-tag.outputs.is_prerelease != 'true' && format('webgrip/{0}:latest', needs.parse-release-tag.outputs.image) || '' }}

  # ── Supply chain security ──────────────────────────────────────────────────
  # cosign signing + CycloneDX SBOM attestation via OpenBao Transit (the key never
  # leaves OpenBao; the runner authenticates with its k8s ServiceAccount) + a
  # Dependency-Track upload. Runs on the in-cluster runner so it can reach Harbor
  # (LAN-only), OpenBao, and Dependency-Track. Signs prereleases and finals alike.
  # Harbor-only signing. (The GHCR mirror + GHCR signing were removed — Harbor is the source of
  # truth and every consumer pulls through it. The .github/ pipeline still publishes to GHCR.)
  release-sign-harbor:
    name: 'Sign & Attest (Harbor)'
    needs: [parse-release-tag, release-distribute-harbor]
    runs-on: docker
    # Forgejo: mint a per-job OIDC token (claims: repository/event_name/ref) so the action can
    # authenticate to OpenBao's JWT auth for signing. (permissions: is ignored by Forgejo.)
    enable-openid-connect: true
    permissions:
      contents: read
    steps:
      # Local composite action — requires the repo checked out (checkout@v5, not v6).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Owner hardcoded `webgrip` — github.repository_owner is empty on Forgejo's workflow_dispatch.
      - name: Sign, attest and SBOM (Harbor)
        uses: ./.forgejo/actions/cosign-sign-attest
        with:
          registry: harbor.webgrip.dev
          image-name: harbor.webgrip.dev/webgrip/${{ needs.parse-release-tag.outputs.image }}
          image-version: ${{ needs.parse-release-tag.outputs.version }}
        env:
          REGISTRY_USERNAME: ${{ secrets.HARBOR_ROBOT_USER }}
          REGISTRY_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
