name: '[Workflow] On Documentation Change'

# Publishes this repo's docs to docs.<domain>/infrastructure/ — the homelab
# ADR-0052 estate rollout (path-per-repo on the shared Garage docs-site bucket):
# Zensical build + llms/redirect graft + gitleaks secret gate, prefix-scoped
# rclone sync (repos cannot clobber each other). Replaces the Codeberg Pages
# leg, which never served a page (ADR-0038 superseded by ADR-0052; the Codeberg
# repo handoff was never done).

on:
  push:
    branches:
      - '*'
    paths:
      - 'docs/techdocs/**'
      - '.forgejo/workflows/on_docs_change.yml'
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: 'The directory containing the techdocs files'
        required: false
        default: 'docs/techdocs'

jobs:
  generate-documentation:
    name: 'Generate'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@d531c756f1a58faa238ab545b3d3000786eed566 # main
    with:
      source-dir: ${{ github.event.inputs.source-dir || 'docs/techdocs' }}

  deploy-docs-site:
    name: 'Deploy (docs site / Garage web)'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@d531c756f1a58faa238ab545b3d3000786eed566 # main
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      dest-prefix: infrastructure
      # strict:false until this repo's links are cleaned; flip like homelab did.
      strict: 'false'
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
