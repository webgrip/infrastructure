name: '[Workflow] On Source Change'

# Forgejo mirror of .github/workflows/on_source_change.yml. Adaptations:
#   - determine-changed-directories + semantic-release resolve against the .forgejo/ tree
#   - GitHub App token minting is dropped; the CI bot's WEBGRIP_CI_TOKEN is used instead
#     (NOT secrets.FORGEJO_TOKEN — that resolves to the built-in per-job token, which
#     attributes releases to Ghost and suppresses the native `release` event)
#   - semantic-release publishes via the Gitea/Forgejo plugin (the action sets GITEA_URL, so the
#     shared .releaserc.js selects @saithodev/semantic-release-gitea over @semantic-release/github)
# Releases created here trigger .forgejo/workflows/on_release_published.yml, which builds
# and pushes the image to the in-cluster Harbor.

concurrency:
  group: push-${{ github.ref_name }}

on:
  push:
    branches:
      - '**'
    paths:
      - 'ops/docker/**'
      - '.forgejo/actions/semantic-release-monorepo/action.yml'
      - '.forgejo/workflows/on_source_change.yml'
      - '.forgejo/workflows/on_release_published.yml'

jobs:
  # Guard: every ops/docker/<image> dir MUST carry a .releaserc.cjs hardcoding
  # tagFormat: '<image>-v${version}'. Without it, `npx semantic-release` (run bare in the
  # per-image release, no --config) falls back to the built-in default tagFormat 'v${version}',
  # cuts ROOT tags, and never emits a version -> the image is never built/pushed/signed. This
  # already bit two new image dirs (erfbeeld-ci, node-ci-runner) silently. Fail loudly instead.
  guard-releaserc:
    name: 'Guard: per-image .releaserc.cjs present'
    runs-on: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - shell: bash
        run: |
          set -euo pipefail
          missing=0
          for d in ops/docker/*/; do
            if [ ! -f "${d}.releaserc.cjs" ]; then
              echo "::error::${d} has no .releaserc.cjs — it will cut a root v* tag and never release its image. Add one: const { makeConfig, dockerVerifyGate } = require('@webgrip/semantic-release-config'); module.exports = makeConfig({ monorepo: true, manifest: 'npm', verifyReleaseCmd: dockerVerifyGate() }); (tag prefix comes from this dir's package.json name)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "all ops/docker/* dirs carry a .releaserc.cjs"
          exit "$missing"

      # Second half of the same guarantee, and the one the loop above cannot see. It iterates
      # ops/docker/*/ only, so a matrix entry for ops/docker/<image>/<subdir> is invisible to it —
      # which is how run 166 cut a root v2.2.0 from ops/docker/semantic-release-rust/toolchain.
      # max-level: 1 is what keeps a matrix entry an IMMEDIATE child; if it is ever dropped, the
      # reusable's default of 2 silently restores the phantom-image path. Fail here instead.
      - name: 'Guard: image matrix stays one level deep'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qE "^\s*max-level: '1'" .forgejo/workflows/on_source_change.yml; then
            echo "::error::changed-images must pass max-level: '1' — without it a file inside an image dir's subdirectory becomes its own release train and cuts a ROOT tag (run 166: v2.2.0)"
            exit 1
          fi
          echo "changed-images pins max-level: 1"

  # NB: the caller job id must NOT equal the reusable workflow's inner job id. Forgejo v15
  # flattens an expanded reusable workflow's inner jobs into the caller's graph; when the ids
  # collide the resulting plan has no dependency-free job and Forgejo rejects the workflow with
  # "the workflow must contain at least one job without dependencies". The reusable's inner job is
  # `determine-changed-directories`, so this caller job is named `changed-images`. (GitHub
  # namespaces inner jobs under the caller, so the same file is fine on the .github side.)
  changed-images:
    name: 'Determine changed images'
    uses: webgrip/workflows/.forgejo/workflows/determine-changed-directories.yml@546c0e02f6ca473419b9a8aa48e430304efaeebf # main
    with:
      inside-dir: 'ops/docker'
      # max-level MUST be 1: one image is one IMMEDIATE child of ops/docker. The reusable defaults
      # to 2, which truncates changed paths at two segments instead of one — so a file inside a
      # SUBDIRECTORY of an image dir yields `ops/docker/<image>/<subdir>` as its own matrix entry:
      # a phantom image. Run 166:
      # ops/docker/semantic-release-rust/toolchain/package-lock.json produced a release train named
      # `toolchain`, which (having no .releaserc.cjs of its own) fell through to semantic-release's
      # default tagFormat and cut a ROOT release, v2.2.0, on this repository. That is exactly what
      # the guard-releaserc job above exists to prevent, arriving by a route the guard cannot see:
      # it only iterates ops/docker/*/.
      max-level: '1'

  # Builds every changed image ON THE BRANCH, without releasing or pushing anything.
  #
  # Why this exists: release-per-image below is gated on main/development, so on a feature branch
  # NOTHING was ever built. A green branch run meant "the guards passed", not "the image compiles" —
  # and the runs were suspiciously fast (21-56s) for exactly that reason. The only way to discover a
  # broken Dockerfile was to merge and watch main go red, which is how cve-gate burned four
  # consecutive merges (runs 188, 192, 194, 196) to learn four separate one-line facts: the DHI
  # registry needs a proxy default, jq is dynamically linked, musl's ldd writes to stderr, and this
  # base has no ldd at all. Every one of those was discoverable on the branch.
  #
  # This runs the SAME `docker buildx build` the release path's verifyRelease gate runs — same
  # build-args, same Harbor layer cache — but with --output=type=cacheonly, so it produces no image,
  # pushes nothing, and cuts no tag. Main stops being the test environment.
  build-check:
    name: 'Build check'
    needs: [changed-images]
    # Only off main/development: there, release-per-image already builds the same thing via
    # verifyRelease, and running both would double every release's build time.
    if: >
      always()
      && github.ref != 'refs/heads/main'
      && github.ref != 'refs/heads/development'
      && needs.changed-images.result == 'success'
      && needs.changed-images.outputs.matrix != '[]'
    runs-on: docker
    strategy:
      # Report every broken image in one run rather than stopping at the first.
      fail-fast: false
      # Deliberately NOT max-parallel: 1. That setting exists on release-per-image to serialise the
      # version-bump commits those jobs push, and Forgejo ignores it anyway. Nothing here writes, so
      # concurrency is bounded only by the runner pool.
      matrix:
        include: ${{ fromJson(needs.changed-images.outputs.matrix) }}
    # Hoisted to job env so the login step can be skipped when unset. The `secrets` context is not
    # dependably available in a step-level `if:` — `env` is, so the secret is mapped once here and
    # the condition reads that.
    env:
      HARBOR_ROBOT_USER: ${{ secrets.HARBOR_ROBOT_USER }}
      HARBOR_ROBOT_TOKEN: ${{ secrets.HARBOR_ROBOT_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Login BEFORE buildx setup: the buildkit bootstrap image pulls through Harbor and must be
      # authenticated in case that proxy project isn't anonymous-pull. Mirrors the release path.
      # Skipped rather than failed when the secret is absent — the build then runs cache-cold, which
      # is slow but still a valid check.
      - name: Log in to Harbor
        if: ${{ env.HARBOR_ROBOT_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: harbor.webgrip.dev
          username: ${{ env.HARBOR_ROBOT_USER }}
          password: ${{ env.HARBOR_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Same reason as the release path: pulling buildkit straight from docker.io was the one
          # external fetch left in the hot path and it flakes (run 125).
          driver-opts: image=harbor.webgrip.dev/dockerhub/moby/buildkit:buildx-stable-1

      - name: Build ${{ matrix.basename }} (no push)
        shell: bash
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          # Build-args MUST stay in lockstep with on_release_published.yml and with
          # dockerVerifyGate() in @webgrip/semantic-release-config. A check that builds differently
          # from the release path is a check that passes while the release fails — which is the
          # failure mode this job exists to remove, not reproduce.
          #
          # cache-from only, never cache-to: a branch build must not be able to poison the layer
          # cache that main's releases read. A cache miss here costs time; a poisoned cache costs
          # trust in every subsequent release.
          # SOURCE_DATE_EPOCH pinned to the commit's own timestamp, plus buildkit's
          # rewrite-timestamp, makes the build reproducible: the same source produces the same
          # digest regardless of when or where it is built. That is what turns "the digest changed"
          # into a signal — without it, every rebuild differs and tampering is indistinguishable
          # from a Tuesday.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d "@$SOURCE_DATE_EPOCH" 2>/dev/null || date -u -r "$SOURCE_DATE_EPOCH"))"

          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --build-arg REGISTRY_DOCKERHUB=harbor.webgrip.dev/dockerhub \
            --build-arg REGISTRY_GHCR=harbor.webgrip.dev/ghcr \
            --build-arg REGISTRY_MCR=harbor.webgrip.dev/mcr \
            --build-arg REGISTRY_DHI=harbor.webgrip.dev/dhi \
            --cache-from "type=registry,ref=harbor.webgrip.dev/webgrip/${{ matrix.basename }}:cache" \
            --output=type=cacheonly,rewrite-timestamp=true \
            .
          echo "::notice::${{ matrix.basename }} builds. This did NOT push, sign, or release anything."

  release-per-image:
    name: 'Release'
    needs: [changed-images]
    if: >
      always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
      && needs.changed-images.result == 'success'
      && needs.changed-images.outputs.matrix != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize: each release job pushes a chore(release) version-bump commit back to main,
      # so two jobs releasing concurrently race — the loser's push is rejected non-fast-forward
      # and its release silently never cuts (bit ci-runner in run 124/125). One at a time.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.changed-images.outputs.matrix) }}
    # In-cluster Forgejo has a single ephemeral DinD runner pool advertising `docker`.
    # (semantic-release's verifyReleaseCmd runs `docker build`, so it needs the DinD backend.)
    runs-on: docker
    steps:
      # Local `uses: ./…` actions require the repo on disk first; without this the runner
      # cannot read the action ("failed to read action … no files found … action.yml").
      # Mirrors the .github job's checkout (adapted: checkout v5, since v6 is broken on
      # non-GitHub runners, and the CI bot's WEBGRIP_CI_TOKEN instead of a GitHub App token).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release requires all commits/tags
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
      - name: Semantic Release (image)
        uses: ./.forgejo/actions/semantic-release-monorepo
        with:
          package-path: ${{ matrix.path }}
          package-name: ${{ matrix.basename }}
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          # Lets the verifyRelease build reuse the Harbor buildx layer-cache that
          # on_release_published writes, instead of a cold full rebuild every release.
          harbor-robot-user: ${{ secrets.HARBOR_ROBOT_USER }}
          harbor-robot-token: ${{ secrets.HARBOR_ROBOT_TOKEN }}
          # GitHub PAT so Forgejo (the sole release authority) also mirrors the Release object onto
          # the github.com mirror's Releases tab. Best-effort; unset -> mirror step skipped.
          github-release-token: ${{ secrets.GH_RELEASE_TOKEN }}
