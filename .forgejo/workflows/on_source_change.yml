name: '[Workflow] On Source Change'

# Forgejo mirror of .github/workflows/on_source_change.yml. Adaptations:
#   - determine-changed-directories + semantic-release resolve against the .forgejo/ tree
#   - GitHub App token minting is dropped; the CI bot's WEBGRIP_CI_TOKEN is used instead
#     (NOT secrets.FORGEJO_TOKEN — that resolves to the built-in per-job token, which
#     attributes releases to Ghost and suppresses the native `release` event)
#   - semantic-release publishes via the Gitea/Forgejo plugin (the action sets GITEA_URL, so the
#     shared .releaserc.js selects @saithodev/semantic-release-gitea over @semantic-release/github)
# Releases created here trigger .forgejo/workflows/on_release_published.yml, which builds
# and pushes the image to the in-cluster Harbor.

concurrency:
  group: push-${{ github.ref_name }}

on:
  push:
    branches:
      - '**'
    paths:
      - 'ops/docker/**'
      - '.forgejo/workflows/on_source_change.yml'
      - '.forgejo/workflows/on_release_published.yml'

jobs:
  # Guard: every ops/docker/<image> dir MUST carry a .releaserc.cjs hardcoding
  # tagFormat: '<image>-v${version}'. Without it, `npx semantic-release` (run bare in the
  # per-image release, no --config) falls back to the built-in default tagFormat 'v${version}',
  # cuts ROOT tags, and never emits a version -> the image is never built/pushed/signed. This
  # already bit two new image dirs (erfbeeld-ci, node-ci-runner) silently. Fail loudly instead.
  guard-releaserc:
    name: 'Guard: per-image .releaserc.cjs present'
    runs-on: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - shell: bash
        run: |
          set -euo pipefail
          missing=0
          for d in ops/docker/*/; do
            if [ ! -f "${d}.releaserc.cjs" ]; then
              echo "::error::${d} has no .releaserc.cjs — it will cut a root v* tag and never release its image. Add one: const { makeConfig, dockerVerifyGate } = require('@webgrip/semantic-release-config'); module.exports = makeConfig({ monorepo: true, manifest: 'npm', verifyReleaseCmd: dockerVerifyGate() }); (tag prefix comes from this dir's package.json name)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "all ops/docker/* dirs carry a .releaserc.cjs"
          exit "$missing"

      # Second half of the same guarantee, and the one the loop above cannot see. It iterates
      # ops/docker/*/ only, so a matrix entry for ops/docker/<image>/<subdir> is invisible to it —
      # which is how run 166 cut a root v2.2.0 from ops/docker/semantic-release-rust/toolchain.
      # max-level: 1 is what keeps a matrix entry an IMMEDIATE child; if it is ever dropped, the
      # reusable's default of 2 silently restores the phantom-image path. Fail here instead.
      - name: 'Guard: image matrix stays one level deep'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qE "^\s*max-level: '1'" .forgejo/workflows/on_source_change.yml; then
            echo "::error::changed-images must pass max-level: '1' — without it a file inside an image dir's subdirectory becomes its own release train and cuts a ROOT tag (run 166: v2.2.0)"
            exit 1
          fi
          echo "changed-images pins max-level: 1"

  # NB: the caller job id must NOT equal the reusable workflow's inner job id. Forgejo v15
  # flattens an expanded reusable workflow's inner jobs into the caller's graph; when the ids
  # collide the resulting plan has no dependency-free job and Forgejo rejects the workflow with
  # "the workflow must contain at least one job without dependencies". The reusable's inner job is
  # `determine-changed-directories`, so this caller job is named `changed-images`. (GitHub
  # namespaces inner jobs under the caller, so the same file is fine on the .github side.)
  changed-images:
    name: 'Determine changed images'
    uses: webgrip/workflows/.forgejo/workflows/determine-changed-directories.yml@546c0e02f6ca473419b9a8aa48e430304efaeebf # main
    with:
      inside-dir: 'ops/docker'
      # max-level MUST be 1: one image is one IMMEDIATE child of ops/docker. The reusable defaults
      # to 2, which truncates changed paths at two segments instead of one — so a file inside a
      # SUBDIRECTORY of an image dir yields `ops/docker/<image>/<subdir>` as its own matrix entry:
      # a phantom image. Run 166:
      # ops/docker/semantic-release-rust/toolchain/package-lock.json produced a release train named
      # `toolchain`, which (having no .releaserc.cjs of its own) fell through to semantic-release's
      # default tagFormat and cut a ROOT release, v2.2.0, on this repository. That is exactly what
      # the guard-releaserc job above exists to prevent, arriving by a route the guard cannot see:
      # it only iterates ops/docker/*/.
      max-level: '1'

  release-per-image:
    name: 'Release'
    needs: [changed-images]
    if: >
      always()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
      && needs.changed-images.result == 'success'
      && needs.changed-images.outputs.matrix != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Forgejo ignores this (run 177: all three Release jobs started 18:48:57). The version-bump
      # push-back race is handled by the shared composite's retry instead.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.changed-images.outputs.matrix) }}
    # Host-mode runner: steps run in the ci-runner image, which has both the docker CLI + buildx
    # verifyReleaseCmd needs and the locked toolchain at $SEMREL_PREBAKED. Hence no `container:`.
    runs-on: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release requires all commits/tags
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

      # Before buildx setup: the buildkit bootstrap image pulls through Harbor's dockerhub proxy
      # and must be authenticated (run 125: TLS handshake timeout pulling straight from docker.io).
      - name: Log in to Harbor (verifyRelease build cache)
        if: ${{ secrets.HARBOR_ROBOT_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: harbor.webgrip.dev
          username: ${{ secrets.HARBOR_ROBOT_USER }}
          password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ secrets.HARBOR_ROBOT_TOKEN != '' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # docker-container driver — required for `cache-from type=registry`.
          driver-opts: image=harbor.webgrip.dev/dockerhub/moby/buildkit:buildx-stable-1

      # dockerVerifyGate() keys on this for the cached buildx build; unset means a cold build.
      # Owner hardcoded: github.repository_owner is empty on Forgejo, yielding an invalid ref.
      - name: Export build cache ref
        if: ${{ secrets.HARBOR_ROBOT_TOKEN != '' }}
        run: echo "BUILD_CACHE_REF=harbor.webgrip.dev/webgrip/${{ matrix.basename }}:cache" >> "$GITHUB_ENV"

      # Shared composite, not a repo-local copy. Installs nothing (webgrip/workflows ADR-0005).
      - name: Semantic Release (image)
        id: release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release-monorepo@main
        with:
          package-path: ${{ matrix.path }}
          package-name: ${{ matrix.basename }}
          monorepo: 'true'
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}

      # Reflect the release onto the github.com mirror's Releases tab; Forgejo stays the sole
      # authority. Best-effort by design: a mirror hiccup must not fail an already-cut release.
      - name: Mirror release to GitHub (best-effort)
        if: ${{ steps.release.outputs.tag != '' && secrets.GH_RELEASE_TOKEN != '' }}
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.WEBGRIP_CI_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}
        run: |
          set -uo pipefail   # deliberately NOT -e: best-effort
          notes="$(curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_URL%/}/api/v1/repos/${REPO}/releases/tags/${TAG}" 2>/dev/null | jq -r '.body // ""')"
          # target_commitish so GitHub can create the tag if the push-mirror has not synced it.
          body="$(jq -nc --arg t "$TAG" --arg b "$notes" --arg c "$BRANCH" --argjson pre "${IS_PRERELEASE}" \
            '{tag_name:$t, name:$t, body:$b, target_commitish:$c, prerelease:$pre}')"
          code="$(curl -sS -o /tmp/ghrel.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPO}/releases" -d "$body" || echo 000)"
          case "$code" in
            201) echo "mirrored release ${TAG} to GitHub" ;;
            422) echo "::notice::GitHub release ${TAG} already exists — skipping" ;;
            *)   echo "::warning::GitHub release mirror for ${TAG} -> HTTP ${code}: $(cat /tmp/ghrel.json 2>/dev/null) (non-fatal)" ;;
          esac
