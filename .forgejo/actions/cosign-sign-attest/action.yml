name: "Supply Chain Security: Sign, Attest & SBOM (per registry)"
description: >-
  Forgejo/Harbor analog of .github/actions/cosign-sign-attest. Signs the pushed image
  with cosign via OpenBao Transit — the signing key is generated in OpenBao and NEVER
  leaves it. The job authenticates with a per-job Forgejo Actions OIDC token (requires
  enable-openid-connect) exchanged at OpenBao's JWT auth, whose role is bound to this
  repo + event=release + ref=refs/tags/* — so ONLY the release workflow on a tag can sign
  (no Fulcio, no private key in Forgejo secrets, no shared runner ServiceAccount), then
  generates a CycloneDX + SPDX SBOM with Syft, attests the CycloneDX SBOM into Harbor,
  and uploads it to Dependency-Track. Verified at admission by the Kyverno
  image-verify-harbor-audit policy using the matching public key.
  GitHub-only capabilities are intentionally dropped: SLSA build provenance
  (actions/attest-build-provenance) and the Trivy SARIF -> GitHub Security tab upload
  have no Forgejo analog; in-cluster Trivy Operator + Harbor's scanner + Dependency-Track
  cover vulnerability analysis instead.

inputs:
  registry:
    description: "Harbor registry host"
    required: false
    default: "harbor.webgrip.dev"
  image-name:
    description: "Fully-qualified image name WITHOUT tag, e.g. harbor.webgrip.dev/webgrip/github-runner"
    required: true
  image-version:
    description: "Version tag that was pushed (e.g. 1.2.3)"
    required: true
  dependency-track-url:
    description: "In-cluster Dependency-Track API base URL"
    required: false
    default: "http://dependency-track-api-server.security.svc.cluster.local:8080"
  cosign-version:
    description: "cosign release to install"
    required: false
    # Deliberately held on 2.x: cosign 3.x changes the default bundle/attestation format and the
    # verification surface, so it must be rolled out together with the Kyverno image-verify policy
    # and anything already consuming these attestations. Renovate will raise the major as a PR —
    # treat it as a coordinated migration, not a version bump.
    # renovate: datasource=github-releases depName=sigstore/cosign
    default: "v2.4.3"
  syft-version:
    description: "Syft release to install"
    required: false
    # renovate: datasource=github-releases depName=anchore/syft
    default: "v1.48.0"
  openbao-addr:
    description: "In-cluster OpenBao address (Vault-compatible API)"
    required: false
    default: "http://openbao.security.svc.cluster.local:8200"
  openbao-role:
    description: "OpenBao JWT-auth role (auth/forgejo) granting Transit sign-only on the cosign key"
    required: false
    default: "cosign-signer"
  oidc-audience:
    description: "Audience to request for the Forgejo OIDC token; must match the role's bound_audiences"
    required: false
    default: "openbao-cosign"
  transit-key:
    description: "OpenBao Transit key name used to sign"
    required: false
    default: "cosign-webgrip"
  vex-author:
    description: >-
      Fallback author recorded on the OpenVEX document when a statement file does not name one.
      A VEX statement is an attributable security assertion; it should never be anonymous.
    required: false
    default: "WebGrip Ops <ryan@webgrip.nl>"

runs:
  using: composite
  steps:
    # Absolute github.com URLs: Forgejo's default action host (data.forgejo.org) is an incomplete
    # mirror and 404s on these (as it does on actions/github-script). Pin to the canonical source.
    - name: Install cosign
      uses: https://github.com/sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Install Syft (SBOM generator)
      uses: https://github.com/anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: ${{ inputs.syft-version }}

    - name: Log in to the target registry
      shell: bash
      env:
        # Generic registry creds so this action signs ANY registry (Harbor robot, GHCR PAT, …). The
        # Harbor robot username carries a literal '$' (robot$webgrip+ci); env-var expansion keeps it
        # intact, and --password-stdin keeps the token out of argv/logs.
        REGISTRY_USERNAME: ${{ env.REGISTRY_USERNAME }}
        REGISTRY_TOKEN: ${{ env.REGISTRY_TOKEN }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        printf '%s' "$REGISTRY_TOKEN" \
          | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

    - name: Resolve image digest
      id: digest
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-name }}:${{ inputs.image-version }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        # Always sign/attest by digest, never by tag (prevents tag-mutation attacks).
        DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{.Manifest.Digest}}')"
        [[ "$DIGEST" == sha256:* ]] || { echo "::error::could not resolve digest for $IMAGE_REF"; exit 1; }
        echo "image-with-digest=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

    - name: "Generate SBOM (Syft: CycloneDX)"
      id: sbom
      shell: bash
      env:
        IMAGE: ${{ steps.digest.outputs.image-with-digest }}
        # The job runs inside the runner's dind sidecar, whose cgroup is capped at 3Gi. Syft's
        # default parallelism (one worker per CPU) cataloging a multi-GB toolchain image
        # (rust-ci-runner, tauri-ci-runner) blows past that and the kernel kills it silently —
        # the step log just stops after 15-25 min (runs 102/104/123). Single-threaded
        # cataloging bounds peak RSS; it's slower but survives.
        SYFT_PARALLELISM: "1"
        # The 3Gi cap is on the RUNNER container (dind gets 6Gi), and the node it lands on is
        # memory-bound at ~78% with CPU idle at ~17% — so the honest fix is raising that limit.
        # Until there is memory to spare, cut the work instead of the parallelism.
        #
        # File cataloging is what actually consumes the memory: syft hashes every file in the image
        # to populate SBOM file entries, which is why the step log stalls on things like
        # `/usr/lib/x86_64-linux-gnu/perl/5.36.0/CORE/warnings.h`. Nothing downstream reads them —
        # Dependency-Track ingests PACKAGES, Kyverno counts `.components`, and the CVE gate matches
        # package coordinates. Setting selection=none drops the file section entirely and takes the
        # peak RSS with it.
        #
        # `owned-by-package` is the middle setting, chosen over `none` deliberately: it keeps file
        # entries for files that BELONG to a package — which is what file-level forensics actually
        # needs ("was this exact file, with this hash, in that image?") — and drops the unowned
        # remainder that dominates the cost. `none` would have been cheaper and would have removed
        # that capability outright.
        #
        # Packages are unaffected either way, so Dependency-Track, Kyverno's `.components` count and
        # the gate's package matching are untouched. Revert to the syft default when the runner limit
        # is raised; this is a workaround for a memory cap on the wrong resource, not an improvement.
        SYFT_FILE_METADATA_SELECTION: "owned-by-package"
      run: |
        set -euo pipefail
        # registry: source — pull layers straight from Harbor into syft's temp dir instead of
        # routing through the dind daemon (which would store a second full copy of the image).
        # SPDX output dropped: nothing consumed sbom.spdx.json (cosign attests the CycloneDX,
        # Dependency-Track ingests CycloneDX) and serializing a second whole-image document
        # roughly doubles syft's memory footprint.
        #
        # The @1.6 spec pin is LOAD-BEARING, not cosmetic. Unpinned, syft emits the newest
        # CycloneDX it supports — 1.7 since syft 1.4x. Dependency-Track validates uploads against
        # its bundled schemas and tops out at 1.6, so it rejected every BOM this action produced
        # with a bare `400 Bad Request`. The upload step is fail-soft (a DT outage must never fail
        # a release), so the rejection surfaced only as a `::warning::` nobody read: DT ingested
        # NOTHING from run 133 through run 180. The v1.21.0 -> v1.48.0 bump in 5da16be is what
        # crossed the 1.6/1.7 line.
        #
        # The same document is what `cosign attest` signs below, so the pin also keeps the
        # attestation predicate readable by 1.6-capable consumers — including the Kyverno
        # `{{ components | length(@) }}` condition in homelab-cluster's image-verify-harbor-audit.
        # Raise this only after confirming Dependency-Track advertises the newer spec.
        syft "registry:$IMAGE" -o "cyclonedx-json@1.6=sbom.cdx.json"
        echo "components=$(jq '.components | length' sbom.cdx.json)" >> "$GITHUB_OUTPUT"

    - name: "Compose OpenVEX document"
      id: vex
      shell: bash
      env:
        IMAGE: ${{ steps.digest.outputs.image-with-digest }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_VERSION: ${{ inputs.image-version }}
        VEX_AUTHOR: ${{ inputs.vex-author }}
      run: |
        set -euo pipefail
        # Statements are hand-authored and reviewed in ops/vex/statements/<image>.openvex.json
        # (see ops/vex/README.md). This step does NOT invent suppressions — it only re-targets
        # reviewed ones at the digest that was actually built.
        basename="${IMAGE_NAME##*/}"
        src="ops/vex/statements/${basename}.openvex.json"
        digest="${IMAGE#*@}"
        # Consumed by the CVE gate step below to look up this image's budget.
        echo "basename=${basename}" >> "$GITHUB_OUTPUT"

        if [ ! -f "$src" ]; then
          echo "no VEX statements for ${basename}; nothing to attest"
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "statements=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Reject a malformed document loudly rather than attesting garbage: a VEX doc that fails to
        # parse would otherwise silently suppress nothing while looking like it works.
        jq -e 'type=="object" and (.statements|type=="array")' "$src" >/dev/null \
          || { echo "::error::${src} is not a valid OpenVEX document (expected object with .statements[])"; exit 1; }

        # Stamp the built digest onto every statement's product set. Authors write the unversioned
        # purl (pkg:oci/<image>); we emit BOTH the digest-qualified purl and the literal image
        # reference, because scanners match VEX products against whichever identifier they used for
        # the scan target and the two differ between grype and trivy.
        jq --arg purl "pkg:oci/${basename}@${digest}" \
           --arg ref  "${IMAGE}" \
           --arg id   "https://openvex.dev/docs/webgrip/${basename}-${IMAGE_VERSION}" \
           --arg author "${VEX_AUTHOR}" \
           '. as $doc
            | .["@context"] = "https://openvex.dev/ns/v0.2.0"
            | .["@id"] = $id
            | .author = (.author // $author)
            | .version = (.version // 1)
            | .statements = [ .statements[] | .products = [ {"@id": $purl}, {"@id": $ref} ] ]' \
           "$src" > vex.openvex.json

        n="$(jq '.statements | length' vex.openvex.json)"
        echo "present=true" >> "$GITHUB_OUTPUT"
        echo "statements=${n}" >> "$GITHUB_OUTPUT"

        # Surface what is being suppressed IN THE RUN LOG. A suppression that nobody sees is an
        # allowlist; printing status+justification per CVE is what keeps it reviewable after merge.
        echo "VEX statements applied to ${basename} (${n}):"
        jq -r '.statements[] | "  \(.vulnerability.name // .vulnerability["@id"] // "?")  \(.status)  \(.justification // .action_statement // "-")"' vex.openvex.json

    # Gate BEFORE sign. A signature is supposed to mean something: with this in front of it, it
    # means "built by CI AND within its CVE budget", not merely "built by CI". An over-budget image
    # stays in Harbor but unsigned — and unsigned is what admission refuses.
    #
    # Deferred until cve-gate 0.2.0 existed in Harbor, because wiring it in the same change that
    # first built that image would have made cve-gate's own release depend on an image that did not
    # exist yet. It exists now, so the bootstrap reason is gone and ALLOW_MISSING_GATE should never
    # be needed again.
    - name: CVE budget gate
      id: cve
      uses: ./.forgejo/actions/cve-gate
      with:
        image-ref: ${{ steps.digest.outputs.image-with-digest }}
        image-name: ${{ steps.vex.outputs.basename }}

    - name: Sign & attest via Forgejo OIDC -> OpenBao Transit
      id: sign
      shell: bash
      env:
        VEX_PRESENT: ${{ steps.vex.outputs.present }}
        VAULT_ADDR: ${{ inputs.openbao-addr }}
        OPENBAO_ROLE: ${{ inputs.openbao-role }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        TRANSIT_KEY: ${{ inputs.transit-key }}
        IMAGE: ${{ steps.digest.outputs.image-with-digest }}
      run: |
        set -euo pipefail
        # 1) Fetch this job's Forgejo OIDC token (requires enable-openid-connect on the job).
        #    Its claims must satisfy the OpenBao cosign-signer role's bound_claims/bound_audiences.
        #    NB: the Forgejo flow triggers on_release_published via workflow_dispatch on a branch,
        #    NOT a release event on a tag — so the role must bind event_name=workflow_dispatch, not
        #    event_name=release/ref=refs/tags/* (the GitHub-shaped binding). See the printed claims.
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::no OIDC token endpoint — is enable-openid-connect set on this job?"; exit 1; }
        # GitHub's request URL already has a query string; Forgejo's may not — pick the right separator
        # so the audience param is actually applied (a malformed URL yields the default audience -> 400).
        case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) sep='&';; *) sep='?';; esac
        oidc_code="$(curl -sS -o /tmp/oidc.json -w '%{http_code}' \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${OIDC_AUDIENCE}" || echo 000)"
        [ "$oidc_code" = "200" ] || { echo "::error::OIDC token request HTTP ${oidc_code}: $(cat /tmp/oidc.json 2>/dev/null)"; exit 1; }
        oidc="$(jq -r '.value' /tmp/oidc.json)"
        [ -n "$oidc" ] && [ "$oidc" != "null" ] || { echo "::error::OIDC token endpoint returned no .value"; exit 1; }
        # Diagnostic: decode + print the token's CLAIMS only (never the token itself). These are what
        # the OpenBao role binds against — compare to bound_claims/bound_audiences if the login 400s.
        b64pad() { p="$(printf '%s' "$1" | tr '_-' '/+')"; m=$(( ${#p} % 4 )); [ "$m" -ne 0 ] && p="${p}$(printf '%*s' $((4 - m)) '' | tr ' ' '=')"; printf '%s' "$p"; }
        echo "OIDC token claims: $(b64pad "$(printf '%s' "$oidc" | cut -d. -f2)" | base64 -d 2>/dev/null | jq -c '{sub, repository, event_name, ref, workflow, aud}' 2>/dev/null || echo '<undecodable>')"
        # 2) Exchange it for a short-lived OpenBao token scoped to Transit sign-only. Capture the body
        #    so a rejected claim/audience shows the exact reason instead of a bare curl exit 22.
        login_code="$(curl -sS -o /tmp/bao.json -w '%{http_code}' --request POST \
          --data "$(jq -nc --arg jwt "$oidc" --arg role "$OPENBAO_ROLE" '{jwt:$jwt, role:$role}')" \
          "${VAULT_ADDR}/v1/auth/forgejo/login" || echo 000)"
        [ "$login_code" = "200" ] || { echo "::error::OpenBao JWT login HTTP ${login_code}: $(cat /tmp/bao.json 2>/dev/null)"; exit 1; }
        VAULT_TOKEN="$(jq -r '.auth.client_token' /tmp/bao.json)"
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "::error::OpenBao login returned no client_token"; exit 1; }
        export VAULT_ADDR VAULT_TOKEN
        # 3) The signing key never leaves OpenBao: cosign calls transit/sign over the API.
        # --tlog-upload=false keeps signing fully in-cluster: with a static OpenBao Transit key we do
        # NOT need the public sigstore transparency log (rekor.sigstore.dev), which would publish our
        # image digests + timestamps to a world-readable, immutable log and add an internet dependency.
        # Safe because verification is key-only: the Kyverno image-verify-harbor-audit policy has no
        # `rekor` block (unlike the GHCR keyless policy), so it never looks up a tlog entry.
        cosign sign   --yes --tlog-upload=false --key "hashivault://${TRANSIT_KEY}" "$IMAGE"
        cosign attest --yes --tlog-upload=false --key "hashivault://${TRANSIT_KEY}" \
          --predicate sbom.cdx.json --type cyclonedx "$IMAGE"
        # 4) OpenVEX rides the same key as the SBOM. Signing the suppressions matters more than
        #    signing the inventory: an unsigned VEX document is an unauthenticated instruction to a
        #    downstream scanner to ignore a CVE. Attested here, a consumer can verify WHO decided a
        #    finding was not exploitable before honouring it.
        if [ "${VEX_PRESENT:-false}" = "true" ]; then
          cosign attest --yes --tlog-upload=false --key "hashivault://${TRANSIT_KEY}" \
            --predicate vex.openvex.json --type openvex "$IMAGE"
        fi
        # 5) The CVE-budget verdict. This is the attestation that closes the loop with admission.
        #    Harbor cannot: it has no VEX support (goharbor/harbor#22720) and its cve_allowlist is
        #    project-wide with no product scope, so its prevent_vul would block on findings we have
        #    already reviewed. The gate's verdict is VEX-aware by construction — it counts what is
        #    left AFTER suppression — so signing that verdict and verifying it at admission enforces
        #    the same answer the gate reached, without Harbor needing to understand any of it.
        if [ -f cve-budget.json ]; then
          cosign attest --yes --tlog-upload=false --key "hashivault://${TRANSIT_KEY}" \
            --predicate cve-budget.json --type https://webgrip.dev/attestations/cve-budget/v1 "$IMAGE"
        else
          echo "::error::no cve-budget.json to attest — this image will be signed WITHOUT a budget verdict, and admission will refuse it once the Kyverno policy is enforcing."
        fi

    - name: "Generate Harbor-native SBOM accessory (fail-soft)"
      # Harbor-only: this hits Harbor's v2 API (no analog on ghcr.io etc.), so skip it for other
      # registries — the cosign attestation + DT upload above already cover GHCR's provenance.
      if: ${{ contains(inputs.registry, 'harbor') }}
      shell: bash
      env:
        REGISTRY_USERNAME: ${{ env.REGISTRY_USERNAME }}
        REGISTRY_TOKEN: ${{ env.REGISTRY_TOKEN }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ steps.digest.outputs.image-with-digest }}
      run: |
        set -euo pipefail
        # The cosign attestation above is a `.att` accessory consumed by Kyverno admission +
        # Dependency-Track — it does NOT populate Harbor's own "SBOM" column. That column is fed
        # ONLY by Harbor's native (scanner-backed) SBOM generator, which produces a separate `.sbom`
        # accessory. Ask Harbor to generate it for the pushed DIGEST so the registry UI/API exposes
        # an SBOM too. Harbor >= 2.11 with an SBOM-capable scanner (Trivy):
        #   POST /api/v2.0/projects/{project}/repositories/{repo}/artifacts/{ref}/scan {"scan_type":"sbom"}
        # Fail-soft (like the Dependency-Track upload): a robot missing the sbom/scan permission, an
        # older Harbor, or a scanner without SBOM support must NEVER fail the release — the signed
        # cosign attestation already proves provenance, and this column is convenience visibility.
        # IMAGE = harbor.webgrip.dev/webgrip/<image>@sha256:<digest>
        digest="${IMAGE##*@}"
        repo_path="${IMAGE%@*}"      # harbor.webgrip.dev/webgrip/<image>
        repo_path="${repo_path#*/}"  # webgrip/<image>  (drop the registry host)
        project="${repo_path%%/*}"   # webgrip
        repository="${repo_path#*/}" # <image>  (may itself contain '/' for nested repos)
        # Harbor wants the repository path-segment URL-encoded ('/' -> %2F); single-segment names
        # like techdocs-builder are unaffected.
        repo_enc="${repository//\//%2F}"
        url="https://${REGISTRY}/api/v2.0/projects/${project}/repositories/${repo_enc}/artifacts/${digest}/scan"
        # Keep the robot token out of argv/the process list: pass credentials via a 0600 curl config,
        # not -u (the robot user's literal '$'/'+' survive the quoted curl-config value verbatim).
        umask 077
        cfg="$(mktemp)"; trap 'rm -f "$cfg"' EXIT
        printf 'user = "%s:%s"\n' "$REGISTRY_USERNAME" "$REGISTRY_TOKEN" > "$cfg"
        code="$(curl -sS -K "$cfg" -o /tmp/sbom-gen.json -w '%{http_code}' \
          -X POST "$url" -H 'Content-Type: application/json' \
          --data '{"scan_type":"sbom"}' || echo 000)"
        case "$code" in
          200|202) echo "Harbor SBOM generation queued for ${project}/${repository}@${digest}" ;;
          *) echo "::warning::Harbor SBOM generation request returned HTTP ${code} (non-fatal): $(cat /tmp/sbom-gen.json 2>/dev/null)" ;;
        esac

    - name: Upload SBOM to Dependency-Track (fail-soft)
      shell: bash
      env:
        DT_API_KEY: ${{ env.DT_API_KEY }}
        DT_URL: ${{ inputs.dependency-track-url }}
        PROJECT: ${{ inputs.image-name }}
        VERSION: ${{ inputs.image-version }}
      run: |
        set -euo pipefail
        if [ -z "${DT_API_KEY:-}" ]; then
          echo "DT_API_KEY not set; skipping Dependency-Track upload"; exit 0
        fi
        # Fail-soft: DT may be unreachable from the runner (NetworkPolicy); cluster-side
        # Trivy Operator + Harbor scanner still cover this image, so never fail the build.
        code="$(curl -sS -o /dev/null -w '%{http_code}' \
          -X POST "${DT_URL}/api/v1/bom" \
          -H "X-Api-Key: ${DT_API_KEY}" \
          -F autoCreate=true \
          -F "projectName=${PROJECT}" \
          -F "projectVersion=${VERSION}" \
          -F "bom=@sbom.cdx.json;type=application/json" || echo 000)"
        # Fail-soft, but NOT fail-silent — and the two are not the same failure.
        # 5xx/000 is DT being down or unreachable: transient, self-healing, a warning is right.
        # 4xx is DT rejecting what we SENT: a permanent bug in this action that will repeat on
        # every release until a human changes something. Emitting both as `::warning::` is how a
        # CycloneDX schema rejection went unnoticed for ~50 releases. 4xx now emits `::error::`
        # (visible in the run's annotations) while still exiting 0, so a broken DT integration is
        # loud without a DT outage ever blocking a release.
        case "$code" in
          200|201) echo "uploaded SBOM to Dependency-Track (${PROJECT}:${VERSION})" ;;
          4*)      echo "::error::Dependency-Track REJECTED the SBOM: HTTP ${code}. This is a bug in this action (bad payload/credentials/schema version), not an outage — it will repeat every release until fixed. Release not blocked." ;;
          *)       echo "::warning::Dependency-Track unreachable (HTTP ${code}); SBOM not uploaded. Non-fatal — retry is the next release." ;;
        esac

    - name: Summary
      # `if: always()` so a failed release still explains itself — which means this step MUST branch
      # on what actually happened. It used to print "Signed (cosign via OpenBao Transit)"
      # unconditionally, so when the gate failed in run 221 and signing never ran, the job summary
      # asserted a signature on an image that has none. A supply-chain summary that reports the
      # happy path regardless of outcome is worse than no summary: it is the artifact a human reads
      # to decide whether to trust the release.
      if: always()
      shell: bash
      env:
        IMAGE: ${{ steps.digest.outputs.image-with-digest }}
        COMPONENTS: ${{ steps.sbom.outputs.components }}
        VEX_PRESENT: ${{ steps.vex.outputs.present }}
        VEX_STATEMENTS: ${{ steps.vex.outputs.statements }}
        GATE_OUTCOME: ${{ steps.cve.outcome }}
        SIGN_OUTCOME: ${{ steps.sign.outcome }}
      run: |
        {
          if [ "${SIGN_OUTCOME}" = "success" ]; then
            echo "## 🔐 Supply chain (Harbor)"
            echo ""
            echo "- Signed (cosign via OpenBao Transit): \`${IMAGE}\`"
            echo "- CycloneDX SBOM (spec 1.6) attested in Harbor + uploaded to Dependency-Track (${COMPONENTS:-?} components)"
            if [ "${VEX_PRESENT:-false}" = "true" ]; then
              echo "- OpenVEX attested: ${VEX_STATEMENTS:-0} reviewed statement(s) — see \`ops/vex/statements/\`"
            else
              echo "- OpenVEX: no statements for this image (nothing suppressed)"
            fi
            echo "- Harbor-native SBOM accessory generation requested for the pushed digest (populates Harbor's SBOM column; fail-soft)"
          else
            echo "## ❌ Supply chain (Harbor) — NOT SIGNED"
            echo ""
            echo "\`${IMAGE:-<digest unresolved>}\` is **in Harbor and unsigned**. It was pushed by the build job;"
            echo "this job is what would have vouched for it, and it did not get that far."
            echo ""
            echo "| stage | outcome |"
            echo "| --- | --- |"
            echo "| CVE budget gate | \`${GATE_OUTCOME:-did not run}\` |"
            echo "| cosign sign + attest | \`${SIGN_OUTCOME:-did not run}\` |"
            echo ""
            echo "Kyverno's image-verify policy will refuse this digest once promoted to Enforce."
            echo "Fix the failure above and cut a new patch release — do not re-tag, and consider"
            echo "deleting this tag so an unsigned artifact is not left pullable."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
