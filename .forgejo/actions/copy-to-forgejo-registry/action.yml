name: "Copy a signed release to the Forgejo registry"
description: >-
  Copies a released image from Harbor to forgejo.webgrip.dev with its cosign signature and
  attestations, for consumers outside the homelab that cannot reach Harbor, and fails unless
  both registries serve the same digest.

inputs:
  image:
    description: "Image name under webgrip/, e.g. infra-runner"
    required: true
  version:
    description: "Released version tag, e.g. 0.2.0"
    required: true

runs:
  using: composite
  steps:
    - name: Copy and compare digests
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        : "${HARBOR_USER:?}" "${HARBOR_TOKEN:?}" "${WEBGRIP_CI_TOKEN:?}"
        DOCKER_CONFIG="$(mktemp -d)"
        export DOCKER_CONFIG
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT

        accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
        repo="webgrip/${IMAGE}"

        header_digest() {
          tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'
        }

        harbor_digest() {
          curl -fsSI -u "${HARBOR_USER}:${HARBOR_TOKEN}" -H "Accept: ${accept}" \
            "https://harbor.webgrip.dev/v2/${repo}/manifests/${VERSION}" | header_digest
        }

        forgejo_anonymous_digest() {
          local token
          token="$(curl -fsS "https://forgejo.webgrip.dev/v2/token?scope=repository:${repo}:pull&service=container_registry" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')"
          curl -fsSI -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
            "https://forgejo.webgrip.dev/v2/${repo}/manifests/${VERSION}" | header_digest
        }

        json_field() {
          sed -nE "s/.*\"$1\":\"([^\"]+)\".*/\\1/p"
        }

        forgejo_push_preflight() {
          local login token status location headers
          login="$(curl -fsS -u "webgrip-ci:${WEBGRIP_CI_TOKEN}" https://forgejo.webgrip.dev/api/v1/user | json_field login)" || {
            echo "::error::WEBGRIP_CI_TOKEN does not authenticate to the Forgejo API"
            return 1
          }
          [ "$login" = webgrip-ci ] || {
            echo "::error::WEBGRIP_CI_TOKEN belongs to '${login}', not webgrip-ci"
            return 1
          }
          token="$(curl -fsS -u "webgrip-ci:${WEBGRIP_CI_TOKEN}" \
            "https://forgejo.webgrip.dev/v2/token?scope=repository:${repo}:pull,push&service=container_registry" | json_field token)"
          headers="$(mktemp)"
          status="$(curl -sS -o /dev/stderr -D "$headers" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" "https://forgejo.webgrip.dev/v2/${repo}/blobs/uploads/")"
          location="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="location"{print $2}')"
          rm -f "$headers"
          if [ "$status" != 202 ]; then
            echo "::error::webgrip-ci authenticates but may not push to forgejo.webgrip.dev/${repo}: HTTP ${status} on starting an upload. Check that the token carries write:package and that webgrip-ci's org team has the packages unit."
            return 1
          fi
          case "$location" in
            http*) curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${token}" "$location" || true ;;
            /*) curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer ${token}" "https://forgejo.webgrip.dev${location}" || true ;;
          esac
          echo "webgrip-ci may push to forgejo.webgrip.dev/${repo}"
        }

        forgejo_push_preflight

        printf '%s' "$HARBOR_TOKEN" | cosign login harbor.webgrip.dev -u "$HARBOR_USER" --password-stdin
        printf '%s' "$WEBGRIP_CI_TOKEN" | cosign login forgejo.webgrip.dev -u webgrip-ci --password-stdin

        source_digest="$(harbor_digest)"
        [ -n "$source_digest" ] || { echo "::error::harbor.webgrip.dev/${repo}:${VERSION} not found"; exit 1; }

        cosign copy --force "harbor.webgrip.dev/${repo}:${VERSION}" "forgejo.webgrip.dev/${repo}:${VERSION}" || {
          echo "::error::webgrip-ci passed the push check with an explicit token, so cosign did not present the Forgejo login it was given"
          exit 1
        }

        copied_digest="$(forgejo_anonymous_digest)"
        [ "$copied_digest" = "$source_digest" ] || {
          echo "::error::forgejo.webgrip.dev/${repo}:${VERSION} serves ${copied_digest:-nothing} anonymously, Harbor serves ${source_digest}"
          exit 1
        }
        cosign tree "forgejo.webgrip.dev/${repo}@${source_digest}"
        echo "copied ${repo}@${source_digest} to forgejo.webgrip.dev, anonymously pullable"
