name: "[Action] Semantic Release"
description: "Forgejo: run semantic-release for a single monorepo package path (e.g. ops/docker/<image>), publishing releases via the Gitea/Forgejo API."

# Forgejo mirror of .github/actions/semantic-release-monorepo/action.yml. Adaptations:
#   - checkout v6 -> v5 (was: v6 broken on non-GitHub runners; disproven 2026-09-18, the pin stays
#     as a pin rather than a workaround)
#   - GITHUB_TOKEN auth -> GITEA_URL/GITEA_TOKEN for @saithodev/semantic-release-gitea
#   - sets GITEA_URL below, which makes the shared .releaserc.js select the Gitea/Forgejo publish
#     plugin (@saithodev/semantic-release-gitea) instead of @semantic-release/github

inputs:
  release-type:
    description: "The type of release (reserved for parity with the GitHub action; unused here)"
    required: false
  token:
    description: "Forgejo token used for checkout/push and creating releases"
    required: false
  package-path:
    description: "Path to the package directory (repo-relative), e.g. ops/docker/helm-deploy"
    required: true
  package-name:
    description: "Package name used for tag prefix, e.g. helm-deploy"
    required: true
  config-version:
    description: "VESTIGIAL — the toolchain (config included) is pinned by the repo-root package.json + package-lock.json and installed with `npm ci`; this input is ignored. Kept only so existing workflow call sites don't break."
    required: false
    default: "1"
  registry:
    description: "Registry the verifyRelease build caches against (must match the publish path's registry)"
    required: false
    default: "harbor.webgrip.dev"
  harbor-robot-user:
    description: "Harbor robot user. When set (with the token), the verifyRelease build uses buildx registry cache instead of a cold `docker build`."
    required: false
  harbor-robot-token:
    description: "Harbor robot token. When set (with the user), enables the cached verifyRelease build."
    required: false
  github-release-token:
    description: "GitHub PAT (classic: repo, or fine-grained: contents+read/write) used to mirror the Release object onto the github.com mirror so its Releases tab stays populated. When unset, the mirror step is skipped."
    required: false
  sbom-generator:
    description: >-
      Image BuildKit uses to generate the candidate build's SBOM attestation (ADR-0009). Mirrors
      the pin in webgrip/workflows' docker-build-push-registry-fast so the candidate carries the
      same attestations the publish path would have produced — that equivalence is the whole
      point of promoting by digest.
    required: false
    # renovate: datasource=docker depName=docker/buildkit-syft-scanner versioning=docker
    default: "harbor.webgrip.dev/dockerhub/docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68"

outputs:
  version:
    description: "Bare semver of the release, from webgrip-release's released output (empty if none)"
    value: ${{ steps.semantic-release.outputs.version }}
  tag:
    description: "Full git tag of the release, e.g. rust-ci-runner-v1.4.0 (empty if none)"
    value: ${{ steps.semantic-release.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Check out repo
      # Pinned to v5. Not a workaround: the "v6 is broken on non-GitHub runners" claim was
      # disproven on 2026-09-18 by a canary on the real runner (homelab-cluster run 1710).
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # semantic-release requires all commits/tags
        token: ${{ inputs.token || github.token }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.22.2"

    # Cache the npm download cache so `npm ci` resolves from disk instead of re-fetching
    # every run. Keyed on the committed lockfile: a toolchain bump rolls the key naturally.
    - name: Cache npm downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-semrel-${{ hashFiles('package-lock.json') }}

    # Node 24's bundled npm (11.16) intermittently requests scoped-package tarballs with the
    # scope's %2F decoded to a literal slash — Forgejo's npm route 404s that form (the encoded
    # form serves fine), which killed 4/13 release jobs in run 135 on the
    # @webgrip/semantic-release-config download. Pin an npm from before the URL normalization
    # change until the Forgejo registry tolerates decoded slashes, then unpin.
    - name: Pin npm (Forgejo rejects decoded %2F in scoped tarball URLs)
      shell: bash
      run: npm install -g npm@11.4.2

    # When Harbor creds are provided, log in and put a builder in front of semantic-release, then
    # export BUILD_CACHE_REF. .releaserc.cjs keys on BUILD_CACHE_REF to run the cached buildx
    # verifyRelease build; without these it falls back to a plain (cold) `docker build`.
    #
    # THE VERIFY BUILD WAS THE LAST COLD BUILD IN THE PIPELINE. Everything else moved to the
    # shared per-node buildkitd; this job did not, so `dockerVerifyGate()` kept creating a
    # throwaway docker-container builder with an empty local cache — a full rebuild of the image
    # on every release, seconds before on_release_published builds the very same thing again.
    # Run 240 shows what that costs: 7m8s, and enough Harbor traffic to take 502s on the base
    # image manifest and fail the release outright.
    #
    # BUILDX_BUILDER is how it reaches semantic-release: buildx honours that env var, and
    # dockerVerifyGate() lives in @webgrip/semantic-release-config where no `--builder` flag can
    # be passed from here.
    - name: Log in to Harbor (verifyRelease build cache)
      if: ${{ inputs.harbor-robot-token != '' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        ROBOT_USER: ${{ inputs.harbor-robot-user }}
        ROBOT_TOKEN: ${{ inputs.harbor-robot-token }}
      run: |
        set -euo pipefail
        # --password-stdin: an argv password is visible in the daemon's process table.
        printf '%s' "$ROBOT_TOKEN" | docker login "$REGISTRY" --username "$ROBOT_USER" --password-stdin

    - name: Select a builder for the verifyRelease build
      if: ${{ inputs.harbor-robot-token != '' }}
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        BUILDKITD_ENDPOINT: tcp://forgejo-buildkitd.forgejo.svc.cluster.local:1234
      run: |
        set -euo pipefail
        name="semrel-${GITHUB_RUN_ID:-0}-$RANDOM"

        host="${BUILDKITD_ENDPOINT#tcp://}"; host="${host%%:*}"
        port="${BUILDKITD_ENDPOINT##*:}"
        # bash /dev/tcp probes name resolution and reachability in one go, matching how the build
        # composite and the runner entrypoint pick their endpoints.
        if (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; then
          exec 3>&- || true
          if docker buildx create --name "$name" --driver remote --use "${BUILDKITD_ENDPOINT}" >/dev/null 2>&1 \
             && docker buildx inspect --bootstrap --builder "$name" >/dev/null 2>&1; then
            echo "BUILDX_BUILDER=$name" >> "$GITHUB_ENV"
            echo "verifyRelease will build on the shared node buildkitd (warm cache)"
            exit 0
          fi
          docker buildx rm --force "$name" >/dev/null 2>&1 || true
        fi

        # Fallback: the throwaway builder this used to always create. Buildkit image pinned to the
        # Harbor proxy rather than docker.io — that direct pull was the one external fetch left in
        # the release hot path and it flaked (run 125: TLS handshake timeout killed both release
        # jobs) besides burning Docker Hub's anonymous rate limit.
        echo "::warning::${BUILDKITD_ENDPOINT} unreachable; verifyRelease builds on a throwaway builder with a cold local cache."
        docker buildx create \
          --name "$name" \
          --driver docker-container \
          --driver-opt "image=${REGISTRY}/dockerhub/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec" \
          --use >/dev/null
        docker buildx inspect --bootstrap --builder "$name" >/dev/null
        echo "BUILDX_BUILDER=$name" >> "$GITHUB_ENV"

    - name: Export build cache ref
      if: ${{ inputs.harbor-robot-token != '' }}
      shell: bash
      # Mirrors docker-build-push-registry's cache tag: it pushes the image to
      # <registry>/<owner>/<image>:<version> and writes buildx cache to the same ref with :cache.
      # Owner is hardcoded `webgrip` to MATCH the publish path (on_release_published also hardcodes
      # webgrip): github.repository_owner is empty on Forgejo here too, which would yield
      # `<registry>//<image>:cache` (double slash) — an invalid ref that never matches the cache.
      run: |
        echo "BUILD_CACHE_REF=${{ inputs.registry }}/webgrip/${{ inputs.package-name }}:cache" >> "$GITHUB_ENV"
        # ADR-0009: with these two set, dockerVerifyGate() (config >= 1.2) upgrades the verify
        # build from --output=type=cacheonly to a full release-grade build — provenance, SBOM,
        # version labels — pushed as a candidate tag. on_release_published then promotes that
        # digest instead of rebuilding. A config without candidate support ignores both, and a
        # release pipeline that finds no candidate builds as before: either side can lag the
        # other.
        #
        # This is a tag PREFIX: the gate appends -<version> (which only it knows — the version
        # exists after commit analysis, inside semantic-release). Keying by version, not by
        # GITHUB_SHA, is load-bearing: @semantic-release/git creates the version-bump commit
        # AFTER verify and the release tag points at THAT commit, so a sha-keyed candidate
        # (cand-<push sha>) can never be found from the tag — measured on node-ci-runner-v1.0.2,
        # whose tag targets the [skip ci] bump commit, parent of the push that built the
        # candidate. The version is the one name both sides derive independently.
        echo "BUILD_CANDIDATE_REF=${{ inputs.registry }}/webgrip/${{ inputs.package-name }}:cand" >> "$GITHUB_ENV"
        echo "BUILD_SBOM_GENERATOR=${{ inputs.sbom-generator }}" >> "$GITHUB_ENV"

    - name: Run webgrip-release
      shell: bash
      id: semantic-release
      env:
        RELEASE_TOKEN: ${{ inputs.token || github.token }}
        FORGE_URL: ${{ vars.FORGEJO_INSTANCE_URL || 'https://forgejo.webgrip.dev' }}
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail

        if [[ ! -d "${GITHUB_WORKSPACE}/${PACKAGE_PATH}" ]]; then
          echo "::error::package-path does not exist: ${PACKAGE_PATH}"
          exit 1
        fi

        forge_host="${FORGE_URL#http*://}"
        npm config set "@webgrip:registry" "${FORGE_URL}/api/packages/webgrip/npm/"
        npm config set "//${forge_host}/api/packages/webgrip/npm/:_authToken" "${RELEASE_TOKEN}"
        (cd "${GITHUB_WORKSPACE}" && npm ci)

        node -e '
          const path = require("path"), fs = require("fs");
          const root = process.env.GITHUB_WORKSPACE;
          const v = p => require(path.join(root, "node_modules", p, "package.json")).version;
          const gen = v("@semantic-release/release-notes-generator");
          const preset = v("conventional-changelog-conventionalcommits");
          const nested = fs.existsSync(path.join(root, "node_modules", "semantic-release",
            "node_modules", "@semantic-release", "release-notes-generator"));
          if (nested) { console.error("FATAL: nested release-notes-generator under semantic-release — the root overrides did not apply; check package.json overrides vs package-lock.json"); process.exit(1); }
          if (parseInt(gen) < 15 || parseInt(preset) < 10) { console.error(`FATAL: resolved notes pair generator=${gen} preset=${preset} — expected >=15 with >=10 (the sanctioned pair per semantic-release-config PR #10)`); process.exit(1); }
          console.log(`notes toolchain OK: generator ${gen} + preset ${preset}, single copy`);
        '

        release_outputs="$(mktemp)"
        GITHUB_OUTPUT="$release_outputs" "${GITHUB_WORKSPACE}/node_modules/.bin/webgrip-release" \
          --layout trains \
          --trains "${PACKAGE_PATH}" \
          --forge-url "${FORGE_URL}"

        released="$(sed -n 's/^released=//p' "$release_outputs")"
        {
          printf 'released=%s\n' "$released"
          printf '%s' "$released" | jq -r 'if length > 0 then "version=\(.[0].version)\ntag=\(.[0].tag)" else empty end'
        } >> "$GITHUB_OUTPUT"

    # No manual dispatch of on_release_published.yml: releases are created with the
    # webgrip-ci bot PAT (inputs.token), and only same-token actions are loop-suppressed —
    # the native `release` event fires and on_release_published's release-event path
    # handles tag + prerelease (the same path the .github App-token side always used).
    # The old dispatch step would now double-fire alongside the event, and 403s under
    # the bot token (ploeg run 48 precedent).

    # Mirror the just-cut release onto the GitHub mirror's Releases tab. Forgejo stays the SOLE release
    # authority (it decided the version + created the canonical Release); this only REFLECTS that object
    # onto github.com. Best-effort: NOT `set -e`, so a GitHub/PAT/mirror-lag hiccup logs a warning and
    # never fails the release or blocks the Harbor build — unlike @semantic-release/github inline, which
    # would abort the whole run. Notes are read back from the Forgejo release so they match exactly.
    - name: Mirror release to GitHub (best-effort)
      if: ${{ steps.semantic-release.outputs.tag != '' && inputs.github-release-token != '' }}
      shell: bash
      env:
        GITEA_URL: ${{ vars.FORGEJO_INSTANCE_URL || github.server_url }}
        GITEA_TOKEN: ${{ inputs.token || github.token }}
        GH_TOKEN: ${{ inputs.github-release-token }}
        TAG: ${{ steps.semantic-release.outputs.tag }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        IS_PRERELEASE: ${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}
      run: |
        set -uo pipefail   # deliberately NOT -e: best-effort
        notes="$(curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
          "${GITEA_URL%/}/api/v1/repos/${REPO}/releases/tags/${TAG}" 2>/dev/null | jq -r '.body // ""')"
        # target_commitish=BRANCH so GitHub resolves the mirrored tag (or creates it at that branch's
        # HEAD if the push-mirror hasn't synced the tag yet).
        body="$(jq -nc --arg t "$TAG" --arg b "$notes" --arg c "$BRANCH" --argjson pre "${IS_PRERELEASE}" \
          '{tag_name:$t, name:$t, body:$b, target_commitish:$c, prerelease:$pre}')"
        code="$(curl -sS -o /tmp/ghrel.json -w '%{http_code}' \
          -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${REPO}/releases" -d "$body" || echo 000)"
        case "$code" in
          201) echo "mirrored release ${TAG} to GitHub" ;;
          422) echo "::notice::GitHub release ${TAG} already exists — skipping" ;;
          *)   echo "::warning::GitHub release mirror for ${TAG} -> HTTP ${code}: $(cat /tmp/ghrel.json 2>/dev/null) (non-fatal)" ;;
        esac
