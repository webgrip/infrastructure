services:
  ci-runner:
    build:
      context: ops/docker/ci-runner
      dockerfile: Dockerfile
  helm-deploy:
    build:
      context: ops/docker/helm-deploy
      dockerfile: Dockerfile
  playwright-runner:
    build:
      context: ops/docker/playwright-runner
      dockerfile: Dockerfile
    volumes:
      - ./tests/playwright-runner:/app
  rust-ci-runner:
    build:
      context: ops/docker/rust-ci-runner
      dockerfile: Dockerfile
  agent-runner:
    build:
      context: ops/docker/agent-runner
      dockerfile: Dockerfile
  rust-releaser:
    image: aaaaaa/rust-releaser:latest
    container_name: rust-releaser
    build:
      context: ops/docker/rust-releaser
      dockerfile: Dockerfile
  semantic-release:
    build:
      context: ops/docker/semantic-release
      dockerfile: Dockerfile
  # The two derived toolchains build FROM the published base, so building either one needs
  # harbor.webgrip.dev/webgrip/semantic-release:<version> pullable, or built and tagged locally
  # first — see ops/docker/semantic-release/README.md.
  semantic-release-monorepo:
    build:
      context: ops/docker/semantic-release-monorepo
      dockerfile: Dockerfile
  semantic-release-rust:
    build:
      context: ops/docker/semantic-release-rust
      dockerfile: Dockerfile